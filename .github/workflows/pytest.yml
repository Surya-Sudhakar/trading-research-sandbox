name: pytest

on:
  push:
    branches:
      - phase-5a-materialized-execution
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest lightgbm pytz httpx2

      - name: Run Phase 1 regression tests
        run: |
          python -m pytest -q tests/test_daily_level_structure_discovery.py tests/test_discovery_context_projection.py tests/test_touch_transition.py

      - name: Run research pipeline regression tests
        run: |
          python -m pytest -q tests/test_research_pipeline.py

      - name: Run full test suite
        run: |
          python -m pytest -q
