[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trading-research-sandbox"
version = "0.1.0"
description = "Read-only IC Markets MT5 market-data foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
  "pydantic>=2.7",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "mcp==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
sandbox = "sandbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
