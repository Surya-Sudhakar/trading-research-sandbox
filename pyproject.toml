[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trading-research-sandbox"
version = "0.1.0"
description = "Read-only IC Markets MT5 market-data foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[project.scripts]
sandbox = "sandbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
